[tools]
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.setup]
run = """
uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu130
uv pip install -e .
mise run clangd-flags
"""

[tasks.clangd-flags]
description = "Generate compile_flags.txt for clangd with this machine's include paths"
run = """
cat > compile_flags.txt <<FLAGS
-xc++
-std=c++17
-DDEBUG
-Isnake_sim/cpp_bindings/area_check/include
-Isnake_sim/cpp_bindings/utils/include
-I$(.venv/bin/python -c 'import pybind11; print(pybind11.get_include())')
-I$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["include"])')
FLAGS
"""
